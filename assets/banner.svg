<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#8b5cf6;#10b981;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#ec4899;#06b6d4;#3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .pulse { animation: pulseAnim 3s ease-in-out infinite alternate; }
      .flow-line { stroke-dasharray: 8, 8; animation: dash 15s linear infinite; }
      .flow-line-rev { stroke-dasharray: 6, 6; animation: dashRev 12s linear infinite; }
      @keyframes pulseAnim { 0% { opacity: 0.3; transform: scale(0.98); } 100% { opacity: 0.7; transform: scale(1.02); } }
      @keyframes dash { to { stroke-dashoffset: -1000; } }
      @keyframes dashRev { to { stroke-dashoffset: 1000; } }
      .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Animated Grid / Network Elements -->
  <g opacity="0.18">
    <path d="M 0 100 L 1200 100 M 0 200 L 1200 200 M 0 300 L 1200 300" stroke="#38bdf8" stroke-width="1" />
    <path d="M 200 0 L 200 400 M 400 0 L 400 400 M 600 0 L 600 400 M 800 0 L 800 400 M 1000 0 L 1000 400" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Glowing background orbs -->
  <circle cx="250" cy="150" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulse" />
  <circle cx="950" cy="240" r="160" fill="#818cf8" opacity="0.12" filter="url(#glow)" class="pulse" />
  <circle cx="600" cy="200" r="180" fill="#c084fc" opacity="0.08" filter="url(#glow)" />

  <!-- Pipeline Connector Branches -->
  <path class="flow-line" d="M 120 280 C 260 280, 280 180, 420 180 S 560 220, 700 220 S 860 140, 1080 140" fill="none" stroke="url(#neonGlow)" stroke-width="3" opacity="0.7" />
  <path class="flow-line-rev" d="M 120 140 C 280 140, 320 240, 480 240 S 720 160, 920 260 S 1020 260, 1080 260" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

  <!-- Database Node 1 (Main/Source) -->
  <g transform="translate(140, 170)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
    <!-- DB Cylinder icon -->
    <ellipse cx="0" cy="-8" rx="14" ry="5" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M -14 -8 L -14 6 C -14 9, 14 9, 14 6 L 14 -8" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M -14 -1 C -14 2, 14 2, 14 -1" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="42" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">v1.0.0 [main]</text>
  </g>

  <!-- Database Node 2 (Branch/Staging) -->
  <g transform="translate(560, 200)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#818cf8" stroke-width="3" filter="url(#glow)" />
    <ellipse cx="0" cy="-9" rx="16" ry="6" fill="none" stroke="#818cf8" stroke-width="2" />
    <path d="M -16 -9 L -16 8 C -16 12, 16 12, 16 8 L 16 -9" fill="none" stroke="#818cf8" stroke-width="2" />
    <path d="M -16 0 C -16 4, 16 4, 16 0" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <text x="0" y="48" font-family="monospace" font-size="12" fill="#a5b4fc" text-anchor="middle">v1.2.0 [branch:ddl]</text>
  </g>

  <!-- Database Node 3 (Live/Target) -->
  <g transform="translate(980, 180)">
    <circle cx="0" cy="0" r="30" fill="#0f172a" stroke="#10b981" stroke-width="3" filter="url(#glow)" />
    <ellipse cx="0" cy="-8" rx="15" ry="5.5" fill="none" stroke="#10b981" stroke-width="2" />
    <path d="M -15 -8 L -15 7 C -15 11, 15 11, 15 7 L 15 -8" fill="none" stroke="#10b981" stroke-width="2" />
    <path d="M -15 0 C -15 3.5, 15 3.5, 15 0" fill="none" stroke="#10b981" stroke-width="1.5" />
    <text x="0" y="45" font-family="monospace" font-size="12" fill="#6ee7b7" text-anchor="middle">Zero-Downtime [prod]</text>
  </g>

  <!-- Animated data pulses along path -->
  <circle r="6" fill="#38bdf8" filter="url(#glow)">
    <animateMotion path="M 140 170 C 260 280, 280 180, 420 180 S 560 200, 560 200" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle r="6" fill="#10b981" filter="url(#glow)">
    <animateMotion path="M 560 200 S 860 140, 980 180" dur="3s" begin="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Central Typography Header -->
  <g transform="translate(600, 85)" text-anchor="middle">
    <rect x="-240" y="-32" width="480" height="36" rx="18" fill="#1e293b" stroke="#334155" opacity="0.9" />
    <text x="0" y="-8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="3">DATABASE DEVOPS &amp; MIGRATION ECOSYSTEM</text>
  </g>

  <g transform="translate(600, 150)" text-anchor="middle">
    <text class="title-text" x="0" y="0" font-size="44" fill="url(#accentGrad)" letter-spacing="-1">Awesome Schema Migration Platform</text>
  </g>

  <g transform="translate(600, 310)" text-anchor="middle">
    <text class="subtitle-text" x="0" y="0" font-size="17" fill="#94a3b8" letter-spacing="1">
      Schema-as-Code  •  Database Branching  •  Declarative DDL  •  Zero-Downtime Releases  •  Governance
    </text>
  </g>

  <!-- Bottom Pills / Tags -->
  <g transform="translate(600, 352)" text-anchor="middle">
    <g transform="translate(-310, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">⚡ Declarative DDL</text>
    </g>
    <g transform="translate(-155, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">🌿 DB Branching</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">🔄 CI/CD GitOps</text>
    </g>
    <g transform="translate(155, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">🛡️ Zero Downtime</text>
    </g>
    <g transform="translate(310, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">📊 Schema Diffing</text>
    </g>
  </g>
</svg>